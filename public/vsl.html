<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z4 Technology — AI Receptionist VSL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    width: 100%; max-width: 960px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 760px; text-align: center; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #60a5fa; text-transform: uppercase; margin-bottom: 20px; }
  h1 { color: #fff; font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .sub { color: rgba(255,255,255,0.65); font-size: 15px; margin-bottom: 28px; }
  video {
    width: 100%; border-radius: 16px;
    box-shadow: 0 24px 80px rgba(37,99,235,0.35);
    background: #000; display: block;
  }
  .cta-row { margin-top: 32px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .cta {
    display: inline-block; padding: 14px 28px; border-radius: 12px;
    background: #2563eb; color: #fff; text-decoration: none;
    font-weight: 700; font-size: 15px;
    box-shadow: 0 12px 40px rgba(37,99,235,0.45);
  }
  .cta.ghost { background: rgba(255,255,255,0.08); box-shadow: none; border: 1px solid rgba(255,255,255,0.18); }
  .watermark { position: fixed; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px; }
  .watermark .logo { font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.6); }
  .watermark .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; color: rgba(255,255,255,0.3); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="watermark"><span class="logo">Z4</span><span class="tag">Technology</span></div>
  <div id="stage">
    <div class="wrap">
      <span class="badge">Watch: 2 minutes</span>
      <h1>Never Miss Another Lead</h1>
      <p class="sub">See how an AI receptionist answers every call, books the job, and pays for itself in one saved customer.</p>
      <video controls playsinline preload="metadata">
        <source src="/vsl/vsl-final-liam.mp4" type="video/mp4">
        Your browser does not support the video tag. Watch directly at <a href="/vsl/vsl-final-liam.mp4" style="color:#60a5fa">/vsl/vsl-final-liam.mp4</a>.
      </video>
      <div class="cta-row">
        <a class="cta" href="/signup.html">Get Started — Free Pilot</a>
        <a class="cta ghost" href="/">Learn More</a>
      </div>
    </div>
  </div>
</body>
</html>
